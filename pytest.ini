[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests

[coverage:run]
source = .
omit =
    tests/*
    __pycache__/*
    */__pycache__/*
    .venv/*
    venv/*
    setup.py
    HuggXet-Downloader.spec
    downloaders/xet_downloader.py
    pyscript
    shibokensupport/*
    signature_bootstrap.py

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = htmlcov
